# The single place the supported targets are declared. CI (build.yml) and the release
# (release.yml) both call this workflow, so adding a platform means adding one entry to a matrix
# below and nothing else: the target drives the publish, the archive name and the release asset
# name all the way through.
#
# The two agents are separate programs - the Windows one is C# on direct Win32, the macOS one is
# Swift on AppKit - so they get a job each rather than one matrix with an unusable shared script.
name: Build agent

on:
  workflow_call:
    inputs:
      ref:
        description: 'Tag or commit to build. Empty builds the commit that triggered the run.'
        type: string
        default: ''

# Building needs to read the repository and nothing else.
permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest already carries the MSVC toolset the Native AOT compiler links with.
          - rid: win-x64
            runs-on: windows-latest
          # Add further targets here, for example:
          # - rid: win-arm64
          #   runs-on: windows-11-arm

    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      # Pinned to a commit, not a tag that can be moved. persist-credentials off: nothing after
      # this step needs the token, so it is not left in .git/config for the build to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Publish Native AOT agent
        run: .\build.ps1 -Rid ${{ matrix.rid }} -Zip
        shell: pwsh

      - name: Report size
        run: Get-Item dist\${{ matrix.rid }}\TextFix.exe | Select-Object Name, Length
        shell: pwsh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextFix-${{ matrix.rid }}
          path: TextFix-${{ matrix.rid }}.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: an Apple Silicon runner cross-compiles
          # the Intel slice, and the result is still under a megabyte.
          - target: universal
            runs-on: macos-14

    name: macos-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build and package the agent
        # The tag drives CFBundleShortVersionString, so a release build is stamped with its own
        # version and an ordinary CI build is not pretending to be one. A release started by hand
        # passes the tag in `ref`; GITHUB_REF_NAME is then the branch it was started from.
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          version="${REF#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="0.0.0" ;;
          esac
          ./build-mac.sh --zip --version "$version"

      - name: Report size
        run: |
          ls -l TextFix-macos-${{ matrix.target }}.zip
          lipo -info dist/macos/TextFix.app/Contents/MacOS/TextFix

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextFix-macos-${{ matrix.target }}
          path: TextFix-macos-${{ matrix.target }}.zip
          if-no-files-found: error
