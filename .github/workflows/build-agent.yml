# The single place the supported targets are declared. CI (build.yml) and the release
# (release.yml) both call this workflow, so adding a platform means adding one entry to a matrix
# below and nothing else: the target drives the publish, the archive name and the release asset
# name all the way through.
#
# Each platform has its own native agent: Win32/C#, AppKit/Swift and Linux/Qt Quick.
name: Build agent

on:
  workflow_call:
    inputs:
      ref:
        description: 'Tag or commit to build. Empty builds the commit that triggered the run.'
        type: string
        default: ''

# Building needs to read the repository and nothing else.
permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest already carries the MSVC toolset the Native AOT compiler links with.
          - rid: win-x64
            runs-on: windows-latest
          # Add further targets here, for example:
          # - rid: win-arm64
          #   runs-on: windows-11-arm

    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      # Pinned to a commit, not a tag that can be moved. persist-credentials off: nothing after
      # this step needs the token, so it is not left in .git/config for the build to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Publish Native AOT agent
        run: .\build.ps1 -Rid ${{ matrix.rid }} -Zip
        shell: pwsh

      - name: Report size
        run: Get-Item dist\${{ matrix.rid }}\TextFix.exe | Select-Object Name, Length
        shell: pwsh

      # The build proves that the code compiles. This proves that the native binary starts,
      # loads its imports and keeps its message loop alive.
      - name: Start the agent and check that it stays up
        shell: pwsh
        run: |
          $agent = Start-Process "dist\${{ matrix.rid }}\TextFix.exe" -PassThru
          Start-Sleep -Seconds 5
          $log = Join-Path $env:LOCALAPPDATA "TextFix\textfix.log"
          if (Test-Path $log) { Get-Content $log }
          if ($agent.HasExited) { throw "TextFix stopped with exit code $($agent.ExitCode)" }
          Stop-Process -Id $agent.Id -Force
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Fatal" -Quiet)) { throw "The log has a fatal error" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextFix-${{ matrix.rid }}
          path: TextFix-${{ matrix.rid }}.zip
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Qt and desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            libwayland-dev pkg-config qt6-wayland qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            libsecret-tools wl-clipboard xdotool x11-utils zip desktop-file-utils
      - name: Build, test and package Linux and Omarchy agents
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          version="${REF#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="0.0.0" ;;
          esac
          ./build-linux.sh --test --zip --version "$version"
          ./build-linux.sh --omarchy --zip --version "$version"
          ./dist/linux-${{ matrix.arch }}/textfix --version
          desktop-file-validate packaging/linux/textfix.desktop
          # The release binary must be a PIE with full RELRO (see textfix.pro).
          readelf -h dist/linux-${{ matrix.arch }}/textfix | grep -q 'Type:.*DYN'
          readelf -d dist/linux-${{ matrix.arch }}/textfix | grep -q 'BIND_NOW'
          # install.sh must put each file in place, and --uninstall must remove each of them.
          ./dist/omarchy-${{ matrix.arch }}/install.sh --prefix /usr --destdir "$PWD/stage"
          test -x stage/usr/bin/textfix
          test -f stage/usr/share/textfix/omarchy/textfix.lua
          ./dist/omarchy-${{ matrix.arch }}/install.sh --prefix /usr --destdir "$PWD/stage" --uninstall
          test -z "$(find stage -type f)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextFix-linux-${{ matrix.arch }}
          path: |
            TextFix-linux-${{ matrix.arch }}.zip
            TextFix-omarchy-${{ matrix.arch }}.zip
          if-no-files-found: error

  omarchy:
    name: omarchy-arch-package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed git nodejs qt6-base qt6-declarative qt6-svg qt6-wayland wayland pkgconf wl-clipboard hyprland libsecret zip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build the native Omarchy package
        shell: bash
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          version="${REF#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="0.0.0" ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          # makepkg refuses root. Build as an unprivileged user inside the container.
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sed -i "s/^pkgver=.*/pkgver=${version//-/.}/" packaging/omarchy/PKGBUILD
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/omarchy' && QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software makepkg --noconfirm"
          mv packaging/omarchy/textfix-omarchy-*.pkg.tar.zst TextFix-omarchy-x64.pkg.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextFix-omarchy-package-x64
          path: TextFix-omarchy-x64.pkg.tar.zst
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: an Apple Silicon runner cross-compiles
          # the Intel slice, and the result is still under a megabyte.
          # macos-26: its Xcode has the macOS 26 SDK. The progress pill needs it for Liquid Glass.
          - target: universal
            runs-on: macos-26

    name: macos-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build and package the agent
        # The tag drives CFBundleShortVersionString, so a release build is stamped with its own
        # version and an ordinary CI build is not pretending to be one. A release started by hand
        # passes the tag in `ref`; GITHUB_REF_NAME is then the branch it was started from.
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          version="${REF#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="0.0.0" ;;
          esac
          ./build-mac.sh --zip --version "$version"

      - name: Report size
        run: |
          ls -l TextFix-macos-${{ matrix.target }}.zip
          lipo -info dist/macos/TextFix.app/Contents/MacOS/TextFix

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextFix-macos-${{ matrix.target }}
          path: TextFix-macos-${{ matrix.target }}.zip
          if-no-files-found: error
